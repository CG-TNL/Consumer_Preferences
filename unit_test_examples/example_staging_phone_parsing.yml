# TEMPLATES, green each before you rely on it.
# Move into models/staging/ and run: dbt build --select stg_consumer_prefs
# These lock the two PRD parsing fixes so they can not regress.

unit_tests:

  # Source 6 OFSLL: NUMBER(38,8) phones carry fractional zeros. The key must strip
  # the trailing .0* before the digit cleanup, not turn the zeros into digits.
  # ADR_PHONE here is written as its ::string form to mimic the NUMBER(38,8) value.
  - name: ofsll_phone_strips_number_decimals
    model: stg_consumer_prefs
    overrides:
      vars:
        run_sources: [6]
    given:
      - input: source('ofsll_lz', 'address')
        rows:
          - ADR_ID: "A1"
            ADR_PHONE: "3035551234.00000000"
            ADR_PERMISSION_TO_CALL_IND: "Y"
            ADR_PERMISSION_TO_TEXT_IND: null
            LAST_UPDATE_DATE: "2026-01-01"
      - input: source('ofsll_lz', 'telecoms')
        rows: []
    expect:
      rows:
        - {OBJECT_KEY: "3035551234", CHANNEL: "PHONE", COMMUNICATION_TYPE: "TRANSACTIONAL", DECISION: "OPT-IN",  SOURCE_SYSTEM_ID: 6}
        - {OBJECT_KEY: "3035551234", CHANNEL: "SMS",   COMMUNICATION_TYPE: "TRANSACTIONAL", DECISION: "OPT-OUT", SOURCE_SYSTEM_ID: 6}

  # Source 2 DNC: DNC_ETL_TAG_UPD is an 18-digit number. LEFT(...,14) plus the
  # YYYYMMDDHH24MISS format must parse it, otherwise every DNC row is dropped.
  - name: dnc_tag_parses_to_timestamp
    model: stg_consumer_prefs
    overrides:
      vars:
        run_sources: [2]
    given:
      - input: source('marketing_crm', 'cm_dnc_phone')
        rows:
          - DNC_PHONE_ID: "D1"
            PHONE_NUMBER: "303-555-1234"
            DNC_LIST: "FED"
            START_DATE: "2026-01-01"
            EXPIRED_DATE: null
            DNC_ETL_TAG_UPD: "202601010000000000"
    expect:
      rows:
        - {OBJECT_KEY: "3035551234", CHANNEL: "PHONE", COMMUNICATION_TYPE: "MARKETING", DECISION: "OPT-OUT", SOURCE_SYSTEM_ID: 2, ETL_TIMESTAMP: "2026-01-01 00:00:00"}
