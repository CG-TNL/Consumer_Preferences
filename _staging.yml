version: 2

# One staging model holds all sources. The 10-column contract is enforced here.

models:
  - name: stg_consumer_prefs
    description: "All sources normalized to the consumer-preferences contract, unioned into one staging table."
    config:
      contract:
        enforced: true
    columns:
      - name: OBJECT_KEY
        data_type: varchar
        tests:
          - not_null
      - name: CHANNEL
        data_type: varchar
        tests:
          - not_null
          - accepted_values:
              values: ['PHONE', 'SMS', 'EMAIL', 'MEDIA']
      - name: COMMUNICATION_TYPE
        data_type: varchar
        tests:
          - not_null
          - accepted_values:
              values: ['MARKETING', 'TRANSACTIONAL', 'ALL']
      - name: DECISION
        data_type: varchar
        tests:
          - not_null
          - accepted_values:
              values: ['OPT-IN', 'OPT-OUT']
      - name: CONSENT_START_DATE
        data_type: timestamp_ntz
      - name: CONSENT_END_DATE
        data_type: timestamp_ntz
      - name: CONSUMER_GROUP
        data_type: varchar
      - name: SOURCE_IDENTIFIER
        data_type: varchar
        tests:
          - not_null:
              config:
                severity: warn
      - name: SOURCE_SYSTEM_ID
        data_type: number
        tests:
          - not_null
      - name: ETL_TIMESTAMP
        data_type: timestamp_ntz
        tests:
          - not_null
