version: 2

# Freshness defaults: warn at 24h, error at 48h (daily minimum).
# Tighten hourly sources once their cadence is known.
# database uses the env_prefix var so the same file works in DEV and PRD.

sources:
  - name: marketing_crm
    database: "{{ var('env_prefix') }}_WD_INT_DB"
    schema: MARKETING_CRM
    tables:
      - name: cm_dnc_phone
        description: "Source 2 DNC phone opt-outs"
        loaded_at_field: "TRY_TO_TIMESTAMP(LEFT(TO_VARCHAR(DNC_ETL_TAG_UPD), 14), 'YYYYMMDDHH24MISS')"
        freshness:
          warn_after:  {count: 24, period: hour}
          error_after: {count: 48, period: hour}

      - name: cust_info_srch_ccpa_req_tbl
        description: "Source 1 Exterro / CCPA requests"
        loaded_at_field: "TRY_TO_TIMESTAMP(LEFT(TO_VARCHAR(ETL_TAG_UPD), 14), 'YYYYMMDDHH24MISS')"
        freshness:
          warn_after:  {count: 24, period: hour}
          error_after: {count: 48, period: hour}

      - name: external_leads
        description: "Source 3 External Leads (email/phone/sms opt-in flags)"
        loaded_at_field: "TRY_TO_TIMESTAMP(ETL_INSERT_DATE::string)"
        freshness:
          warn_after:  {count: 24, period: hour}
          error_after: {count: 48, period: hour}

  - name: sfdc_customservice
    database: "{{ var('env_prefix') }}_WD_LZ_DB"
    schema: SFDC_CUSTOMSERVICE
    tables:
      - name: tmmarketing_texting_permission__c
        description: "Source 4 Journey texting permission"
        loaded_at_field: "TRY_TO_TIMESTAMP(LASTMODIFIEDDATE::string)"
        freshness:
          warn_after:  {count: 24, period: hour}
          error_after: {count: 48, period: hour}

      # Join tables for the Offer Transaction block. No freshness needed.
      - name: quote_v
        description: "Quote reference for Offer Transaction expiration date"
      - name: tmtourrecord__c
        description: "Tour record reference for Offer Transaction expiration date"

  - name: marketing_ownermart
    database: "{{ var('env_prefix') }}_WD_LZ_DB"
    schema: MARKETING_OWNERMART
    tables:
      - name: ff_hello_profiles
        description: "Source 5 Brand Movers / FF Hello Profiles"
        loaded_at_field: "TRY_TO_TIMESTAMP(LOAD_DATE::string)"
        freshness:
          warn_after:  {count: 24, period: hour}
          error_after: {count: 48, period: hour}
      - name: ff_hello_profiles_tap
        description: "Source 5 FF Hello Profiles TAP feed"
        loaded_at_field: "TRY_TO_TIMESTAMP(LOAD_DATE::string)"
        freshness:
          warn_after:  {count: 24, period: hour}
          error_after: {count: 48, period: hour}

  - name: wd_dg
    database: "{{ var('env_prefix') }}_WD_USR_WRKSPC_DB"
    schema: WD_DG
    tables:
      # Reference table for Source 5 segment descriptions. No freshness needed.
      - name: cm_segment
        description: "Segment lookup joined by Source 5"

  - name: ofsll_lz
    database: "{{ var('env_prefix') }}_WD_LZ_DB"
    schema: OFSLL_LZ
    tables:
      - name: address
        description: "Source 6 OFSLL Address (call/text permission)"
        loaded_at_field: "TRY_TO_TIMESTAMP(LAST_UPDATE_DATE::string)"
        freshness:
          warn_after:  {count: 24, period: hour}
          error_after: {count: 48, period: hour}
      - name: telecoms
        description: "Source 6 OFSLL Telecoms (call/text permission)"
        loaded_at_field: "TRY_TO_TIMESTAMP(LAST_UPDATE_DATE::string)"
        freshness:
          warn_after:  {count: 24, period: hour}
          error_after: {count: 48, period: hour}

  - name: marketing_response
    database: "{{ var('env_prefix') }}_WD_LZ_DB"
    schema: MARKETING_RESPONSE
    tables:
      - name: sms_messagetracking_combined
        description: "Source 7 SFMC SMS tracking (STOP opt-outs)"
        loaded_at_field: "TRY_TO_TIMESTAMP(MODIFIEDDATETIME::string)"
        freshness:
          warn_after:  {count: 24, period: hour}
          error_after: {count: 48, period: hour}
