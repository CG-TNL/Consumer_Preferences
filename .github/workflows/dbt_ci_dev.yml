name: dbt CI - DEV

# On every pull request into dev: deploy the project from the feature branch
# into DEV and build it. The warning gate here is lenient (unlimited) so work
# in progress can still merge to dev. Errors still fail the build.

on:
  pull_request:
    branches: [dev]

jobs:
  build_dev:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Snowflake CLI
        run: pip install snowflake-cli

      - name: Deploy the project object into DEV from this branch
        run: |
          snow dbt deploy TEST_DB.WD_EDA.CONSUMER_PREFERENCES \
            --source . \
            --force \
            --temporary-connection \
            --account "${{ secrets.SNOWFLAKE_ACCOUNT }}" \
            --user "${{ secrets.SNOWFLAKE_USER }}" \
            --password "${{ secrets.SNOWFLAKE_PASSWORD }}" \
            --role "${{ secrets.SNOWFLAKE_ROLE }}" \
            --warehouse "${{ secrets.SNOWFLAKE_WAREHOUSE }}"

      - name: Build and test in DEV
        run: |
          set -o pipefail
          snow dbt execute \
            --temporary-connection \
            --account "${{ secrets.SNOWFLAKE_ACCOUNT }}" \
            --user "${{ secrets.SNOWFLAKE_USER }}" \
            --password "${{ secrets.SNOWFLAKE_PASSWORD }}" \
            --role "${{ secrets.SNOWFLAKE_ROLE }}" \
            --warehouse "${{ secrets.SNOWFLAKE_WAREHOUSE }}" \
            TEST_DB.WD_EDA.CONSUMER_PREFERENCES build --target dev \
            2>&1 | tee build_output.log

      - name: Warning gate (DEV, report only)
        run: |
          # DEV is unlimited. Report the warning count but never fail on it.
          LINE=$(grep -E 'WARN=[0-9]+' build_output.log | tail -1)
          echo "Summary: $LINE"
          WARN=$(echo "$LINE" | grep -oE 'WARN=[0-9]+' | cut -d= -f2)
          WARN=${WARN:-0}
          echo "Warnings in DEV: $WARN (limit: unlimited)"
