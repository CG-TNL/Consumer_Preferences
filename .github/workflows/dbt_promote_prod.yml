name: Promote to PRD

# On merge to main: deploy the project into PRD and build it. The job targets
# the "production" GitHub Environment, which has a required reviewer. The deploy
# waits until that reviewer approves in the Actions run.

on:
  push:
    branches: [main]

jobs:
  promote:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Snowflake CLI
        run: pip install snowflake-cli

      - name: Deploy the project object into PRD from main
        run: |
          snow dbt deploy TEST_PRD_DB.WD_EDA.CONSUMER_PREFERENCES \
            --source . \
            --force \
            --temporary-connection \
            --account "${{ secrets.SNOWFLAKE_ACCOUNT }}" \
            --user "${{ secrets.SNOWFLAKE_USER }}" \
            --password "${{ secrets.SNOWFLAKE_PASSWORD }}" \
            --role "${{ secrets.SNOWFLAKE_PROD_ROLE }}" \
            --warehouse "${{ secrets.SNOWFLAKE_WAREHOUSE }}"

      - name: Build in PRD
        run: |
          snow dbt execute \
            --temporary-connection \
            --account "${{ secrets.SNOWFLAKE_ACCOUNT }}" \
            --user "${{ secrets.SNOWFLAKE_USER }}" \
            --password "${{ secrets.SNOWFLAKE_PASSWORD }}" \
            --role "${{ secrets.SNOWFLAKE_PROD_ROLE }}" \
            --warehouse "${{ secrets.SNOWFLAKE_WAREHOUSE }}" \
            TEST_PRD_DB.WD_EDA.CONSUMER_PREFERENCES build --target prod --vars '{"env_prefix":"PRD"}'
