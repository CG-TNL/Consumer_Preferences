version: 2

models:
  - name: consumer_preferences_dbt
    description: "Raw target table mirroring the existing CONSUMER_PREFERENCES. Holds all data including invalid keys and null decisions. Full history, ACTIVE marks the live version."
    config:
      contract:
        enforced: true
    columns:
      - name: OBJECT_KEY
        data_type: varchar
        tests:
          - not_null
      - name: CHANNEL
        data_type: varchar
        tests:
          - not_null
          - accepted_values:
              values: ['PHONE', 'SMS', 'EMAIL', 'MEDIA']
      - name: COMMUNICATION_TYPE
        data_type: varchar
        tests:
          - not_null
          - accepted_values:
              values: ['MARKETING', 'TRANSACTIONAL', 'ALL']
      # DECISION is intentionally untested here. The raw table may hold null,
      # empty, or unexpected decisions. The view cleans and defaults them.
      - name: DECISION
        data_type: varchar
      - name: CONSENT_START_DATE
        data_type: timestamp_ntz
      - name: CONSENT_END_DATE
        data_type: timestamp_ntz
      - name: CONSUMER_GROUP
        data_type: varchar
      - name: SOURCE_IDENTIFIER
        data_type: varchar
        tests:
          - not_null:
              severity: warn
      - name: SOURCE_SYSTEM_ID
        data_type: number
        tests:
          - not_null
          - relationships:
              to: ref('consumer_preference_sources_dbt')
              field: SOURCE_SYSTEM_ID
      - name: ETL_TIMESTAMP
        data_type: timestamp_ntz
        tests:
          - not_null
      - name: ACTIVE
        data_type: boolean
        tests:
          - not_null

  - name: vw_consumer_preferences_dbt
    description: "Clean serving view. Valid contact keys only, decisions defaulted by channel, derived consent end dates."
    columns:
      - name: OBJECT_KEY
        tests:
          - not_null
      - name: CHANNEL
        tests:
          - accepted_values:
              values: ['PHONE', 'SMS', 'EMAIL', 'MEDIA']
      - name: DECISION
        tests:
          - not_null
          - accepted_values:
              values: ['OPT-IN', 'OPT-OUT']
      - name: CONSENT_END_DATE
        tests:
          - not_null

  - name: vw_consumer_preferences_pipeline_health_dbt
    description: "Operational health per node from CONSUMER_PREFERENCES_PIPELINE_RUN_LOG_DBT: last status, time since last success, duration trend, and last rows. Failures sort first."
